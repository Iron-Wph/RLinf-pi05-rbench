defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/openpi_fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-0

runner:
  task_type: sft
  logger:
    log_path: "${oc.env:RBENCH_LOG_ROOT}"
    project_name: rlinf
    experiment_name: "pi05_rbench"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 1000

data:
  dataset_root: "${oc.env:RBENCH_DATASET_ROOT}"
  num_workers: 2
  train_data_paths:
    - "${data.dataset_root}/BALL-REFLECT-01"
    - "${data.dataset_root}/BASKET-RECOVER-01"
    - "${data.dataset_root}/BOOK-EXTRACT-01"
    - "${data.dataset_root}/C-TR-01"
    - "${data.dataset_root}/C-TR-02"
    - "${data.dataset_root}/CARTON-SHIP-01"
    - "${data.dataset_root}/COLD-RETRIEVE-01"
    - "${data.dataset_root}/CUP-SEARCH-01"
    - "${data.dataset_root}/D-LEAK-02"
    - "${data.dataset_root}/D-ROLL-02"
    - "${data.dataset_root}/F-DEV-01"
    - "${data.dataset_root}/L-CARBONATE-01"
    - "${data.dataset_root}/L-DISTILL-01"
    - "${data.dataset_root}/L-EXTRACT-01"
    - "${data.dataset_root}/L-TITRATE-01"
    - "${data.dataset_root}/LID-PROP-01"
    - "${data.dataset_root}/PANCAKE-FLIP-01"
    - "${data.dataset_root}/R-ELECTRORECOVERY-01"
    - "${data.dataset_root}/R-FOAM-01"
    - "${data.dataset_root}/R-IRON-OXYGEN-01"
    - "${data.dataset_root}/R-PICKLE-01"
    - "${data.dataset_root}/TRACK-CLEAR-01"
    - "${data.dataset_root}/W-U01"
    - "${data.dataset_root}/W-U02"
    - "${data.dataset_root}/W-U03"
    - "${data.dataset_root}/W-U07"
    - "${data.dataset_root}/W-U08"
    - "${data.dataset_root}/W-U12"
    - "${data.dataset_root}/W-U14"
    - "${data.dataset_root}/W-U15"
    - "${data.dataset_root}/W-U17"
    - "${data.dataset_root}/WIND-SHIELD-01"
    - "${data.dataset_root}/WORD-ASSEMBLY-01"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 32
  seed: 0

  # Override the default values in model/pi0_5
  model:
    precision: fp32
    pi05: true
    model_path: "${oc.env:RBENCH_BASE_MODEL}"
    action_dim: 8
    num_action_chunks: 10
    add_value_head: False
    openpi:
      task: sft
      config_name: "pi05_rbench"
      action_horizon: 10
      discrete_state_input: true
      num_images_in_input: 2
      model_action_dim: 32
      embed_dtype: bf16
    openpi_data:
      norm_stats_path: "${oc.env:RBENCH_NORM_STATS}"

  optim:
    lr: 7.91e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    sharding_strategy: "no_shard"
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
